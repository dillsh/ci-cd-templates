name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      service_name:
        description: "Docker Compose service name to rebuild and restart"
        type: string
        required: true
      version:
        description: "Version tag to pass as APP_VERSION build arg (e.g. v1.2.3)"
        type: string
        required: false
        default: "dev"
    secrets:
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_SSH_PORT:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          script: |
            set -e
            cd ~/apps/${{ inputs.service_name }}
            git pull
            cd ~/apps/cve-project
            git pull
            docker compose build --build-arg APP_VERSION=${{ inputs.version }} ${{ inputs.service_name }}
            docker compose up -d ${{ inputs.service_name }}
